<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Network-Based Intrusion Detection</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="bg-dark text-light">
  <nav class="navbar navbar-dark navbar-expand-lg nids-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="{{ url_for('login') }}">
        <i class="bi bi-shield-lock-fill text-info fs-4"></i>
        <span>NIDS<span class="text-info">·AI</span></span>
      </a>
    </div>
  </nav>

  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="container mt-4">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            <i class="bi bi-info-circle-fill me-2"></i>{{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <section class="d-flex align-items-center justify-content-center py-5" style="min-height: calc(100vh - 76px);">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
          <div class="upload-card">
            <div class="text-center mb-4">
              <div class="hero-icon-wrap mx-auto mb-3">
                <i class="bi bi-person-lock hero-icon"></i>
              </div>
              <h2 class="page-title mb-1">Admin Login</h2>
              <p class="text-muted mb-0">Use this page only if you want to sign in manually</p>
            </div>

            <form method="POST" action="{{ url_for('login') }}">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control" placeholder="admin" required />
              </div>

              <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" name="password" class="form-control" placeholder="admin123" required />
              </div>

              <button type="submit" class="btn btn-glow w-100 mb-3">
                <i class="bi bi-box-arrow-in-right me-2"></i>Login
              </button>

             
            </form>

            <div class="mt-4 small text-muted text-center">
              Demo credentials: <strong>admin</strong> / <strong>admin123</strong>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
